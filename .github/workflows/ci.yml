name: CI

on:
  push:
    # `kronor` is the long-lived branch Kronor integrates from (see docs/releases.md).
    branches: [main, kronor]
    tags: ["v*", "rc-*"]
  pull_request:
    branches: [main, kronor]
    # Not edited: a run skipped for a title edit would report its jobs as passed
    # to required checks. After retargeting a pull request, close and reopen it
    # (see docs/releases.md).
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  release-tag:
    # A tag the release job would refuse fails here, before anything is built. The
    # job always runs and only its steps are limited to tags: a skipped job would
    # skip every job that waits for it, directly or not.
    name: Check the release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          persist-credentials: false
          # Full history, so the tagged commit can be checked against main.
          fetch-depth: 0
      - name: Check the release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          case "$GITHUB_REF_NAME" in
            v*)
              # A version is v<major>.<minor>.<patch>, so its image tag (1.2.3) can
              # never be a pre-release's (rc-...). At most 9 digits each keeps the
              # image tag far below Docker's 128 characters.
              if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]{1,9}\.[0-9]{1,9}\.[0-9]{1,9}$ ]]; then
                echo "::error::$GITHUB_REF_NAME is not a version tag: use v<major>.<minor>.<patch>, for example v1.2.3."
                exit 1
              fi
              # It moves :latest, which deployments follow without choosing to
              # upgrade, so it may only release a commit made on main itself: one on
              # main's first-parent history. A commit that only reached main through
              # a merge (an intermediate commit of the kronor branch) doesn't count.
              # The full ref, so that a tag named origin/main can't stand in for the
              # branch. Process substitution, not a pipe: grep -q stops reading early,
              # and pipefail would turn that into a failure.
              commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
              if ! grep -qx "$commit" <(git rev-list --first-parent refs/remotes/origin/main); then
                echo "::error::$GITHUB_REF_NAME points at a commit that was not made on main. Only main is released as a version; tag a pre-release rc-* instead."
                exit 1
              fi
              ;;
            rc-*)
              # The tag name becomes the image tag, so it must be a valid Docker tag.
              if ! [[ "$GITHUB_REF_NAME" =~ ^rc-[A-Za-z0-9_.-]{1,125}$ ]]; then
                echo "::error::$GITHUB_REF_NAME can't be an image tag: after rc-, use only letters, digits, _ . and -, at most 125 characters."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unexpected release tag $GITHUB_REF_NAME"
              exit 1
              ;;
          esac

  nix-matrix:
    name: Generate nix github actions matrix
    # Every later job waits for this one, so a refused tag builds nothing.
    needs: release-tag
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: kronor-open
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - id: set-matrix
        name: Generate Nix Matrix
        run: |
          set -Eeu
          matrix="$(nix eval --json '.#githubActions.matrix')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  nix-build:
    name: ${{ matrix.name }} (${{ matrix.system }})
    needs: nix-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJSON(needs.nix-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: kronor-open
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build
        run: nix build -L .#"${MATRIX_ATTR}"
        env:
          MATRIX_ATTR: ${{ matrix.attr }}

  test:
    name: Test
    needs: nix-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: kronor-open
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Disable byte-code-and-object-code
        run: |
          echo "program-options" >> cabal.project.local
          echo "  ghc-options: -fno-byte-code-and-object-code" >> cabal.project.local
      - name: Start infrastructure
        run: docker compose up -d --wait
      - name: Set up database
        run: nix develop -c bash _dev/setup-db.sh
      - name: Build service
        run: nix develop -c cabal build smart-csv-runner
      - name: Start service
        run: |
          nix develop -c bash _dev/smart-csv-runner.sh &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "Service is up after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Service failed to start within 60s"
              exit 1
            fi
            sleep 1
          done
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_LISTENER_USER: smart_csv
          DB_LISTENER_PASSWORD: smart_csv
          DB_LISTENER_DATABASE: smart_csv
          DB_DEQUEUER_USER: smart_csv
          DB_DEQUEUER_PASSWORD: smart_csv
          DB_DEQUEUER_DATABASE: smart_csv
          DB_WORKER_USER: smart_csv
          DB_WORKER_PASSWORD: smart_csv
          DB_WORKER_DATABASE: smart_csv
          DB_REPLICA_CSV_USER: smart_csv
          DB_REPLICA_CSV_PASSWORD: smart_csv
          DB_REPLICA_CSV_DATABASE: smart_csv
          API_PORT: "8000"
          GRAPHQL_URL: http://localhost:8080/v1/graphql
          PORTAL_URL: http://localhost:3000
          JWT_SECRET: Q2x1cUZwQWpmOWVWY3kxZ1NucmNaV09JS2lHQm9MbDY1MUQ3VEUwbDREYz0=
          MAIL_DEV: "True"
          MAIL_HOST: localhost
          MAIL_PORT: "1025"
          AWS_ACCESS_KEY_ID: smartcsvak
          AWS_SECRET_ACCESS_KEY: smartcsvsk
          KRONOR_AWS_FROM: env
          KRONOR_S3_BUCKET: smart-csv-reports
          KRONOR_SIGNED_URL_EXPIRY_TIME_IN_SECONDS: "3600"
          KRONOR_TEST_S3_ENDPOINT_HOSTNAME: localhost
          KRONOR_TEST_S3_ENDPOINT_PORT: "9000"
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
          OTEL_SERVICE_NAME: smart-csv-runner
      - name: Run all tests
        run: nix develop -c cabal test all

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/rc-')
    needs: [release-tag, nix-build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write #need write permission to push docker images
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: kronor-open
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build Docker image
        run: nix build -L '.#dockerImage'
      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/smart-csv-runner
          docker load < result
          case "$GITHUB_REF_NAME" in
            v*)
              # A version: pushed as itself and as :latest.
              VERSION=${GITHUB_REF_NAME#v}
              docker tag smart-csv-runner:latest "$IMAGE:$VERSION"
              docker tag smart-csv-runner:latest "$IMAGE:latest"
              docker push "$IMAGE:$VERSION"
              docker push "$IMAGE:latest"
              ;;
            rc-*)
              # A pre-release: pushed under its own tag only, never :latest.
              docker tag smart-csv-runner:latest "$IMAGE:$GITHUB_REF_NAME"
              docker push "$IMAGE:$GITHUB_REF_NAME"
              ;;
            *)
              echo "::error::Unexpected release tag $GITHUB_REF_NAME"
              exit 1
              ;;
          esac
